# Entorno con el que se corrió todo al 16 de noviembre de 2026.
# Crear:   conda env create -f environment.yml
# Además hacen falta tectonic y latexdiff para la tesis y el visor:
#          brew install tectonic latexdiff
name: tesis-cameras
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - pandas==3.0.5
      - numpy==2.5.3
      - scipy==1.18.1
      - scikit-learn==1.9.1
      - statsmodels==0.15.0
      - geopandas==1.1.4
      - shapely==2.1.2
      - pyproj==3.8.0
      - pyogrio==0.13.0
      - pyarrow==25.0.0
      - matplotlib==3.11.1
      - h3==4.5.0
      - jupyterlab==4.6.3
      - nbconvert==7.17.1
      - ipykernel==7.3.0
